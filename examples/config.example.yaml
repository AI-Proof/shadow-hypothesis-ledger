# The SHL-relevant part of a Hermes profile's config.yaml.
# Everything else (models, providers, toolsets) is unrelated and left out.

plugins:
  enabled:
    - shl-ledger
  entries:
    shl-ledger:
      allow_tool_override: false
      settings:
        evidence_mode: "log"     # start in log mode; switch to "on" after a week of `hermes shl report`
        session_note: true       # the SHL note at the start of each session
        confirmations: true      # a short SHL line when something happened in a reply
        ghost_mode: ask          # or: inert (the agent never offers to restore a rejected assumption)
        timed_review_days: 90    # 0 = no timed reviews

memory:
  write_approval: true   # assumptions must not silently become memory
